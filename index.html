<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RadioHub - Stream Live Radio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <span class="logo-icon">📻</span>
                <span class="logo-text">Radio<span>Hub</span></span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="favoritesHeaderBtn" onclick="showFavoritesTab()">
                    <span class="heart-icon">❤️</span>
                    <span class="badge" id="favBadge" style="display:none;">0</span>
                </button>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="search" id="searchInput" placeholder="Search stations..." oninput="handleSearch(this.value)">
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home', this)">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-tab="genres" onclick="switchTab('genres', this)">
            <span class="nav-icon">🎵</span>
            <span class="nav-label">Genres</span>
        </button>
        <button class="nav-item" data-tab="favorites" onclick="switchTab('favorites', this)">
            <span class="nav-icon">❤️</span>
            <span class="nav-label">Favorites</span>
        </button>
        <button class="nav-item" data-tab="settings" onclick="switchTab('settings', this)">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Home Tab -->
        <div class="tab-content active" id="homeTab">
            <section class="section">
                <h2 class="section-title">Featured Stations</h2>
                <div class="horizontal-scroll" id="featuredStations">
                    <div class="loading-skeleton"></div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">Popular Genres</h2>
                <div class="genre-grid" id="popularGenres"></div>
            </section>

            <section class="section">
                <h2 class="section-title">All Stations</h2>
                <div class="station-list" id="allStationsList"></div>
            </section>
        </div>

        <!-- Genres Tab -->
        <div class="tab-content" id="genresTab" style="display:none;">
            <section class="section">
                <h2 class="section-title">Browse by Genre</h2>
                <div class="genre-grid" id="allGenresGrid"></div>
            </section>
        </div>

        <!-- Favorites Tab -->
        <div class="tab-content" id="favoritesTab" style="display:none;">
            <section class="section">
                <h2 class="section-title">Your Favorites</h2>
                <div class="station-list" id="favoritesList"></div>
                <div class="empty-state" id="emptyFavorites" style="display:none;">
                    <p class="empty-icon">💔</p>
                    <p>No favorites yet</p>
                    <button class="primary-btn" onclick="switchTab('home', document.querySelector('[data-tab=home]'))">Discover Stations</button>
                </div>
            </section>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" id="settingsTab" style="display:none;">
            <section class="section">
                <h2 class="section-title">Settings</h2>
                <div class="settings-list">
                    <div class="setting-item">
                        <span>Default Volume</span>
                        <input type="range" id="defaultVolume" min="0" max="100" value="80" onchange="updateDefaultVolume(this.value)">
                    </div>
                    <div class="setting-item">
                        <span>Contact Us</span>
                        <button class="primary-btn" onclick="showContactForm()">Send Message</button>
                    </div>
                    <div class="setting-item">
                        <span>About RadioHub</span>
                        <button class="primary-btn" onclick="showAbout()">Learn More</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Mini Player -->
    <div class="mini-player" id="miniPlayer" style="display:none;" onclick="openFullPlayer()">
        <div class="mini-progress">
            <div class="mini-progress-fill" id="miniProgressFill"></div>
        </div>
        <div class="mini-content">
            <div class="mini-img" id="miniImg">📻</div>
            <div class="mini-info">
                <h4 id="miniName">Station Name</h4>
                <p id="miniStatus">Playing...</p>
            </div>
            <button class="mini-btn" id="miniPlayBtn" onclick="event.stopPropagation(); togglePlay()">⏸️</button>
            <button class="mini-btn" id="miniFavBtn" onclick="event.stopPropagation(); toggleCurrentFavorite()">🤍</button>
        </div>
    </div>

    <!-- Full Player Modal -->
    <div class="full-player" id="fullPlayer" style="display:none;">
        <div class="player-backdrop" onclick="closeFullPlayer()"></div>
        <div class="player-sheet">
            <div class="player-handle"></div>
            <button class="player-close" onclick="closeFullPlayer()">✕</button>
            
            <div class="player-artwork">
                <div class="artwork-circle">
                    <div class="artwork-inner" id="fullPlayerImg">📻</div>
                </div>
            </div>
            
            <div class="player-details">
                <h2 id="fullPlayerName">Station Name</h2>
                <p id="fullPlayerGenre">Genre</p>
                <p id="fullPlayerCountry">Country</p>
            </div>
            
            <div class="player-controls">
                <button class="player-btn" onclick="previousStation()">⏮</button>
                <button class="player-play-btn" id="fullPlayBtn" onclick="togglePlay()">⏸️</button>
                <button class="player-btn" onclick="nextStation()">⏭</button>
            </div>
            
            <div class="player-volume">
                <span>🔊</span>
                <input type="range" id="volumeControl" min="0" max="100" value="80" onchange="changeVolume(this.value)">
            </div>
            
            <div class="player-actions">
                <button class="action-btn" id="fullFavBtn" onclick="toggleCurrentFavorite()">🤍 Favorite</button>
                <button class="action-btn" onclick="shareCurrentStation()">📤 Share</button>
            </div>
        </div>
    </div>

    <!-- Contact Modal -->
    <div class="contact-modal" id="contactModal" style="display:none;">
        <div class="modal-backdrop" onclick="closeContactForm()"></div>
        <div class="modal-content">
            <h2>Contact Us</h2>
            <form onsubmit="sendContact(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="contactName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="contactEmail" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="contactMessage" rows="4" required></textarea>
                </div>
                <button type="submit" class="primary-btn">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Loading -->
    <div class="global-loading" id="globalLoading">
        <div class="spinner"></div>
        <p>Loading stations...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
