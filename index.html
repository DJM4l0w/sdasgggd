<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="M4FMCLUB">
    <meta name="description" content="M4FMCLUB - Stream thousands of radio stations worldwide">
    
    <title>M4FMCLUB - Online Radio</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-fixes.css">
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
    
    <!-- Performance -->
    <link rel="preconnect" href="https://de1.api.radio-browser.info">
    <link rel="dns-prefetch" href="https://de1.api.radio-browser.info">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splash">
        <div class="splash-logo">📻 M4FMCLUB</div>
    </div>

    <header class="header">
        <div class="header-top">
            <h1 class="logo">📻 M4FM<span>CLUB</span></h1>
            <div class="header-actions">
                <button class="fav-btn" onclick="showMostPlayed()" aria-label="Most Played">
                    📊 <span id="playCount">0</span>
                </button>
                <button class="fav-btn" onclick="showFavorites()" aria-label="Favorites">
                    ❤️ <span id="favCount">0</span>
                </button>
            </div>
        </div>
        <div class="search-box">
            <span>🔍</span>
            <input type="search" id="searchInput" placeholder="Search stations..." oninput="doSearch(this.value)" autocomplete="off" enterkeyhint="search">
        </div>
    </header>

    <div class="genres-scroll" id="genresScroll"></div>

    <main class="main-content">
        <h2 class="section-title" id="listTitle">Loading stations...</h2>
        <div id="stationList" class="station-list"></div>
        <div id="pagination" class="pagination"></div>
    </main>

    <div class="mini-player" id="miniPlayer" style="display:none;" onclick="openPlayer()">
        <div class="mini-img" id="miniImg">📻</div>
        <div class="mini-info">
            <h4 id="miniName">Station</h4>
            <p id="miniStatus">Playing...</p>
            <p id="miniLiveCount" style="color:#00f5d4;font-size:10px;margin:0;">🌍 0 listening</p>
        </div>
        <button class="mini-btn" id="miniPlayBtn" onclick="event.stopPropagation();togglePlay()" aria-label="Play/Pause">⏸️</button>
    </div>

    <!-- ============ PLAYER MODAL PREMIUM ============ -->
    <div class="player-modal" id="playerModal" style="display:none;">
        <div class="modal-backdrop" onclick="closePlayer()"></div>
        <div class="player-sheet">
            <div class="grabber" onclick="closePlayer()"></div>
            <button class="close-btn" onclick="closePlayer()" aria-label="Close">✕</button>
            
            <!-- Capa da rádio girando -->
            <div class="player-artwork-container" onclick="togglePlay()" title="Play/Pause">
                <div class="player-artwork" id="playerArtwork">📻</div>
            </div>
            
            <!-- Equalizador -->
            <div class="player-equalizer">
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
            </div>
            
            <!-- Indicador de Buffering -->
            <div class="buffering-indicator" id="bufferingIndicator" style="display:none;">
                <div class="spinner"></div>
                <span id="bufferingText">Buffering...</span>
            </div>
            
            <h2 class="player-name" id="playerName">Station Name</h2>
            <p class="player-info" id="playerInfo">Info</p>
            
            <div class="player-status">
                <span class="live-badge">🔴 LIVE</span>
                <span class="listeners-count" id="playerLiveCount">🌍 0</span>
            </div>
            
            <!-- Detalhes da Estação -->
            <div class="station-details">
                <div class="detail-item">
                    <span class="detail-label" id="labelCountry">🌍 Country:</span>
                    <span class="detail-value" id="detailCountry">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" id="labelBitrate">📡 Bitrate:</span>
                    <span class="detail-value" id="detailBitrate">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" id="labelGenre">🎵 Genre:</span>
                    <span class="detail-value" id="detailGenre">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" id="labelLanguage">🔗 Language:</span>
                    <span class="detail-value" id="detailLanguage">-</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" onclick="prevStation()" aria-label="Previous">⏮</button>
                <button class="play-btn" id="mainPlayBtn" onclick="togglePlay()" aria-label="Play/Pause">▶️</button>
                <button class="ctrl-btn" onclick="nextStation()" aria-label="Next">⏭</button>
            </div>
            
            <div class="volume-box">
                <span class="volume-icon" id="volumeIcon" onclick="toggleMute()">🔊</span>
                <input type="range" min="0" max="100" value="80" oninput="setVolume(this.value)" id="volumeSlider" aria-label="Volume">
                <button class="mute-btn" onclick="toggleMute()">🔇</button>
            </div>
            
            <div class="actions">
                <button class="action-btn" id="favBtn" onclick="toggleFavorite()">🤍 Favorite</button>
                <button class="action-btn" onclick="shareStation()">📤 Share</button>
                <button class="action-btn" onclick="toggleSleepMenu()">😴 Sleep</button>
            </div>
            
            <div class="sleep-menu" id="sleepMenu">
                <button onclick="setSleep(15)">15 min</button>
                <button onclick="setSleep(30)">30 min</button>
                <button onclick="setSleep(60)">1 hour</button>
                <button onclick="cancelSleep()">Cancel</button>
            </div>
            
            <!-- Histórico de Estações -->
            <div class="history-section">
                <h3 class="history-title" id="historyTitle">📜 Recent</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    
    <!-- Scripts (ordem correta) -->
    <script src="mobile-fixes.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
